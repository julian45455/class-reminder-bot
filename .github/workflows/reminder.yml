name: Daily Class Reminder

on:
  schedule:
    # 16:30 UTC = 20:00 Asia/Tehran (UTC+3:30, no DST).
    # اگر ساعت یادآوری یا timezone را عوض کردید، این عدد را متناسب تغییر دهید.
    - cron: "30 16 * * *"
  workflow_dispatch: {}   # امکان اجرای دستی از تب Actions برای تست

jobs:
  send-reminder:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests pytz jdatetime

      - name: Send reminder
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          TIMEZONE: "Asia/Tehran"
        run: python send_reminder.py
