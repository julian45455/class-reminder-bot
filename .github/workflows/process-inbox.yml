name: Process Telegram Inbox (Auto-add Exams)

on:
  schedule:
    - cron: "*/5 * * * *"   # هر ۵ دقیقه — چون ریپازیتوری Public است محدودیت دقیقه ندارد
  workflow_dispatch: {}

permissions:
  contents: write   # اجازه commit/push به همین ریپازیتوری با توکن پیش‌فرض

jobs:
  process-inbox:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests pytz jdatetime

      - name: Process inbox
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          TIMEZONE: "Asia/Tehran"
        run: python process_inbox.py

      - name: Commit changes if any
        run: |
          git config user.name "exam-bot"
          git config user.email "actions@github.com"
          git add exams.json bot_state.json
          if git diff --cached --quiet; then
            echo "تغییری برای commit نیست."
          else
            git commit -m "ثبت خودکار امتحان از تلگرام"
            git push
          fi
