name: Weekly Exam Reminder

on:
  schedule:
    # 14:30 UTC = 18:00 Asia/Tehran (UTC+3:30) on Wednesdays.
    # اگر روز یا ساعت را عوض کردید، این عدد را متناسب تغییر دهید.
    - cron: "30 14 * * 3"
  workflow_dispatch: {}   # امکان اجرای دستی از تب Actions برای تست

jobs:
  send-exam-reminder:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests pytz jdatetime

      - name: Send weekly exam reminder
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          # اختیاری — آی‌دی گروه/کانال‌هایی که فقط پیام یادآوری برایشان
          # ارسال شود (دستورات افزودن/ویرایش/حذف از این چت‌ها پذیرفته
          # نمی‌شود، چون process_inbox.py فقط CHAT_ID را می‌خواند).
          BROADCAST_CHAT_IDS: ${{ secrets.BROADCAST_CHAT_IDS }}
          TIMEZONE: "Asia/Tehran"
          EXAM_WINDOW_DAYS: "12"
        run: python send_weekly_exams.py
